name: Scrape Election Results

on:
  # Restart every hour, on the hour. GitHub caps a single job at 6h, so we
  # relaunch hourly instead of running one forever; each new run cancels the
  # previous one (see `concurrency` below). Schedules run only from the
  # default branch and may be delayed a few minutes under load.
  schedule:
    - cron: "0 * * * *"
  # Allow kicking it off (or re-starting it) by hand.
  workflow_dispatch:
    inputs:
      eid:
        description: Election ID
        default: "4338"
      delay:
        description: Poll delay in seconds
        default: "60"

# Needed so the running job can push the JSON files back to main.
permissions:
  contents: write

# One scraper at a time: when the hourly run fires, cancel the previous one.
concurrency:
  group: scrape-results
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Hard backstop against hangs. Cancellation via concurrency is the real
    # mechanism; the scraper runs indefinitely until the next hourly run
    # cancels it.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Scrape and commit
        run: >
          uv run scrape scrape ${{ github.event.inputs.eid || '4338' }}
          --delay ${{ github.event.inputs.delay || '60' }}
          --no-moo
          --commit
