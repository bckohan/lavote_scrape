<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LA County Election Results</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f0f1a; color: #e2e8f0; min-height: 100vh; }

    /* ── Header ── */
    .site-header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: #0a0a14; border-bottom: 1px solid #1e1e30; flex-wrap: wrap; }
    .site-header h1 { font-size: 1rem; font-weight: 600; flex: 1; white-space: nowrap; }
    #election-select { background: #1a1a2e; color: #e2e8f0; border: 1px solid #2a2a40; border-radius: 6px; padding: 5px 10px; font-size: 0.85rem; cursor: pointer; }
    .repo-link { font-size: 0.78rem; color: #60a5fa; text-decoration: none; white-space: nowrap; }
    .repo-link:hover { text-decoration: underline; }

    /* ── Search ── */
    .search-wrap { padding: 10px 16px; border-bottom: 1px solid #1a1a2e; }
    #search-input { width: 100%; background: #1a1a2e; color: #e2e8f0; border: 1px solid #2a2a40; border-radius: 6px; padding: 7px 12px; font-size: 0.9rem; }
    #search-input::placeholder { color: #4a5568; }
    #search-input:focus { outline: none; border-color: #3b82f6; }

    /* ── Contest list ── */
    .contest-group.hidden { display: none; }
    .group-header { padding: 10px 16px 3px; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #475569; }
    .contest-row { display: flex; align-items: center; padding: 10px 16px; border-bottom: 1px solid #141420; cursor: pointer; gap: 10px; min-height: 52px; text-decoration: none; color: inherit; }
    .contest-row:hover { background: #15152a; }
    .contest-row.hidden { display: none; }
    .contest-info { flex: 1; min-width: 0; }
    .contest-title { display: block; font-size: 0.82rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .contest-leader { display: block; font-size: 0.72rem; color: #64748b; margin-top: 2px; }
    .match-note { display: block; font-size: 0.68rem; color: #3b82f6; margin-top: 2px; font-style: italic; }
    .sparkline-canvas { flex-shrink: 0; display: block; }
    .badge-party { display: inline-block; font-size: 0.6rem; font-weight: 700; letter-spacing: 0.04em; border-radius: 3px; padding: 1px 4px; margin-left: 5px; vertical-align: middle; white-space: nowrap; }
    .measure-pass-rate { font-size: 0.78rem; font-weight: 600; color: #60a5fa; margin-bottom: 0.6rem; }
    .measure-text { font-size: 0.82rem; color: #94a3b8; line-height: 1.55; }

    /* ── Detail screen ── */
    .detail-header { display: flex; align-items: center; gap: 10px; padding: 11px 16px; background: #0a0a14; border-bottom: 1px solid #1e1e30; flex-wrap: wrap; }
    #back-btn { background: none; border: 1px solid #2a2a40; color: #94a3b8; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 0.82rem; white-space: nowrap; flex-shrink: 0; }
    #back-btn:hover { background: #1a1a2e; color: #e2e8f0; }
    .detail-meta { min-width: 0; }
    .detail-meta h2 { font-size: 0.92rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .detail-election-name { font-size: 0.72rem; color: #64748b; }
    .chart-section { padding: 14px 16px 0; }
    .chart-section + .chart-section { padding-top: 14px; }
    .chart-label { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #475569; margin-bottom: 6px; }
    .annotation { padding: 6px 16px 14px; font-size: 0.72rem; color: #475569; }

    /* ── Loading / error ── */
    .status-msg { padding: 32px 16px; text-align: center; color: #475569; font-size: 0.9rem; }

    /* ── Detail view ── */
    #detail-view { max-width: 900px; margin: 0 auto; padding: 1rem; }
    .charts-container { display: flex; flex-direction: column; gap: 2rem; }
    .chart-section h3 { margin: 0; color: #e2e8f0; font-size: 1rem; }
    .chart-section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.5rem; }
    .toggle-group { display: flex; border: 1px solid #2a2a40; border-radius: 6px; overflow: hidden; }
    .toggle-btn { background: none; border: none; color: #64748b; padding: 3px 10px; font-size: 0.75rem; cursor: pointer; }
    .toggle-btn.active { background: #1e293b; color: #e2e8f0; font-weight: 600; }
    .toggle-btn:hover:not(.active) { background: #15152a; }
    .chart-section .annotation { font-size: 0.8rem; color: #94a3b8; margin-bottom: 0.75rem; }
    .chart-wrap { position: relative; height: 300px; }
    .totals-list { list-style: none; margin: 0; padding: 0; font-size: 0.88rem; }
    .totals-row { display: flex; align-items: center; gap: 0.6rem; padding: 0.35rem 0; border-bottom: 1px solid #1e2d3d; }
    .totals-row:last-child { border-bottom: none; }
    .totals-swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
    .totals-name { flex: 1; color: #e2e8f0; }
    .totals-votes { color: #94a3b8; min-width: 5.5rem; text-align: right; }
    .totals-pct { color: #e2e8f0; font-weight: 600; min-width: 4rem; text-align: right; }
    .totals-total-row { display: flex; justify-content: space-between; margin-top: 0.6rem; padding-top: 0.5rem; border-top: 1px solid #334155; font-size: 0.88rem; color: #94a3b8; }
    .totals-total-row strong { color: #e2e8f0; }
    .totals-row.winner { background: #14532d33; border-radius: 4px; border-left: 3px solid #4ade80; padding-left: calc(0.6rem - 3px); }
    .totals-row.winner .totals-name { color: #4ade80; font-weight: 600; }
    .totals-row.winner .totals-pct { color: #4ade80; }
    .drop-table-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.5rem; }
    .drop-table-header h3 { margin: 0; }
    #btn-copy-csv { background: #334155; color: #e2e8f0; border: none; padding: 0.3rem 0.75rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
    #btn-copy-csv:hover { background: #475569; }
    #btn-copy-csv.copied { background: #14532d; color: #4ade80; }
    .drop-table-wrap { overflow-x: auto; }
    .drop-table { border-collapse: collapse; font-size: 0.78rem; white-space: nowrap; width: 100%; }
    .drop-table th, .drop-table td { padding: 0.3rem 0.6rem; text-align: right; border-bottom: 1px solid #1e2d3d; }
    .drop-table th { color: #64748b; font-weight: 500; position: sticky; top: 0; background: #0f172a; }
    .drop-table td:first-child, .drop-table th:first-child { text-align: left; position: sticky; left: 0; background: #0f172a; z-index: 1; min-width: 9rem; max-width: 14rem; overflow: hidden; text-overflow: ellipsis; }
    .drop-table tr:last-child td { border-bottom: none; font-weight: 600; color: #94a3b8; border-top: 1px solid #334155; }
    .drop-table .winner-cell { color: #4ade80; }
    #update-toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: #14532d; color: #4ade80; padding: 0.4rem 1rem; border-radius: 20px; font-size: 0.8rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100; }
    #update-toast.visible { opacity: 1; }
    @media (max-width: 480px) { .chart-wrap { height: 220px; } .detail-title h2 { font-size: 1.1rem; } #detail-view { padding-left: 0; padding-right: 0; } }

    @media (min-width: 600px) {
      .site-header { padding: 12px 24px; }
      .search-wrap { padding: 10px 24px; }
      .group-header { padding: 10px 24px 3px; }
      .contest-row { padding: 10px 24px; }
      .detail-header { padding: 11px 24px; }
      .chart-section { padding: 16px 24px 0; }
      .annotation { padding: 6px 24px 16px; }
    }
  </style>
</head>
<body>
<div id="update-toast">New results</div>

<!-- Index screen -->
<div id="screen-index">
  <header class="site-header">
    <h1>LA County Election Results</h1>
    <a class="repo-link" href="https://github.com/bckohan/lavote_scrape" target="_blank" rel="noopener">Raw Data</a>
    <select id="election-select"></select>
  </header>
  <div class="search-wrap">
    <input type="search" id="search-input" placeholder="Search contests or candidates…" autocomplete="off">
  </div>
  <main id="contest-list"><p class="status-msg">Loading…</p></main>
</div>

<!-- Detail screen -->
<div id="screen-detail" hidden>
  <header class="detail-header">
    <button id="back-btn">← Back</button>
    <div class="detail-meta">
      <h2 id="detail-title"></h2>
      <span class="detail-election-name" id="detail-election-name"></span>
    </div>
  </header>
  <div id="detail-body"></div>
</div>

<script>
// ─────────────────────────── Constants ───────────────────────────

// Colors assigned by rank (index 0 = top vote getter). Party affiliation is not used.
const RANKED_COLORS = [
  '#4ade80', // 1st  green
  '#f97316', // 2nd  orange
  '#60a5fa', // 3rd  blue
  '#f472b6', // 4th  pink
  '#facc15', // 5th  yellow
  '#a78bfa', // 6th  violet
  '#2dd4bf', // 7th  teal
  '#fb7185', // 8th  rose
  '#818cf8', // 9th  indigo
  '#86efac', // 10th mint
];
const OTHERS_COLOR = '#6b7280';

const PARTY_STYLES = {
  'Democratic':          { label: 'DEM', bg: '#1d4ed8', color: '#fff' },
  'Republican':          { label: 'REP', bg: '#b91c1c', color: '#fff' },
  'Green':               { label: 'GRN', bg: '#15803d', color: '#fff' },
  'Libertarian':         { label: 'LIB', bg: '#a16207', color: '#fff' },
  'Peace and Freedom':   { label: 'P&F', bg: '#9f1239', color: '#fff' },
  'American Independent':{ label: 'AIP', bg: '#7c3aed', color: '#fff' },
};

function measurePassThreshold(passRate) {
  // Returns {value (0-100), strict} for YES win detection.
  if (!passRate) return { value: 50, strict: true };
  const m = passRate.match(/(\d+(?:\.\d+)?)\s*%/);
  if (m) return { value: parseFloat(m[1]), strict: false };
  if (passRate.includes('2/3')) return { value: 200 / 3, strict: false };
  return { value: 50, strict: true }; // majority
}

function yesWins(yesPct, passRate) {
  const { value, strict } = measurePassThreshold(passRate);
  return strict ? yesPct > value : yesPct >= value;
}

function partyBadge(party) {
  const s = PARTY_STYLES[party];
  if (!s) return '';
  return `<span class="badge-party" style="background:${s.bg};color:${s.color}">${s.label}</span>`;
}

// ─────────────────────────── State ───────────────────────────────

const state = {
  index: null,
  currentEid: null,
  elections: {},
};
window.__state = state;

// ─────────────────────────── Utilities ───────────────────────────

function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function encodeFilename(f) {
  return f.split('/').map(seg => encodeURIComponent(seg)).join('/');
}

function parseLabel(filename) {
  // Filenames use Pacific time — extract and reformat directly, no conversion.
  const m = filename.match(/_(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/);
  if (!m) return filename;
  const [, , month, day, hour, min] = m;
  return `${+month}/${+day} ${hour}:${min}`;
}

// Parse a filename into display label plus fields used for day grouping.
// `t` treats the Pacific wall-clock as UTC — only used for relative gaps and
// day bucketing, so the fictional frame is consistent and timezone-safe.
function parseStamp(filename) {
  const m = filename.match(/_(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/);
  if (!m) return { label: filename, t: 0, day: filename, dayKey: filename };
  const [, year, month, day, hour, min] = m;
  return {
    label: `${+month}/${+day} ${hour}:${min}`,
    t: Date.UTC(+year, +month - 1, +day, +hour, +min),
    day: `${+month}/${+day}`,
    dayKey: `${year}-${month}-${day}`,
  };
}

// Bucket drops into the "Per Day" view: a single election-night bar (the first
// drop plus every following drop within `gapHours` of the previous one), then
// one bar per Pacific calendar day. Returns { label, endIndex } per group,
// where endIndex points at the group's last drop in `series`.
function groupDropsByDay(series, gapHours = 6) {
  if (series.length === 0) return [];
  const gapMs = gapHours * 3600 * 1000;
  let eNightEnd = 0;
  for (let k = 1; k < series.length; k++) {
    if (series[k].t - series[k - 1].t >= gapMs) break;
    eNightEnd = k;
  }
  const groups = [{ label: 'e-night', endIndex: eNightEnd }];
  let j = eNightEnd + 1;
  while (j < series.length) {
    let end = j;
    while (end + 1 < series.length && series[end + 1].dayKey === series[j].dayKey) end++;
    groups.push({ label: series[j].day, endIndex: end });
    j = end + 1;
  }
  return groups;
}

function cumulativeTotal(entry) {
  return Object.keys(entry.votes).reduce((s, cid) => s + (entry.votes[cid] || 0), 0);
}

// ─────────────────────────── Data loading ────────────────────────

async function loadIndex() {
  const resp = await fetch('index.json');
  if (!resp.ok) throw new Error(`index.json: ${resp.status}`);
  state.index = await resp.json();
}

function buildLookups(meta) {
  const candidateById = new Map();
  const contestById   = new Map();
  const groupOrder    = [];

  for (const group of meta.Data.ContestGroups) {
    const contestIds = [];
    for (const contest of group.Contests) {
      const candidateIds = [];
      for (const c of contest.Candidates) {
        candidateById.set(c.ID, { name: c.Name, party: c.Party || '' });
        candidateIds.push(c.ID);
      }
      const voteForText = contest.VoteFor || '';
      const voteForMatch = voteForText.match(/\b(one|two|three|four|five|six|seven|eight|nine|\d+)\b/i);
      const wordToNum = { one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9 };
      const seats = voteForMatch
        ? (parseInt(voteForMatch[1]) || wordToNum[voteForMatch[1].toLowerCase()] || 1)
        : 1;
      contestById.set(contest.ID, {
        title: contest.Title,
        groupName: group.Name,
        candidateIds,
        seats,
        type: contest.Type,
        measureText: contest.MeasureText || '',
        measurePassRate: contest.MeasurePassRate || '',
      });
      contestIds.push(contest.ID);
    }
    groupOrder.push({ name: group.Name, contestIds });
  }

  return { candidateById, contestById, groupOrder };
}

function buildTimeSeries(filenames, responses, contestById) {
  const drops = filenames
    .map((f, i) => ({ filename: f, resp: responses[i] }))
    .filter(({ resp }) => resp && Array.isArray(resp.Data))
    .sort((a, b) => a.filename < b.filename ? -1 : 1);

  const parsedDrops = drops.map(({ filename, resp }) => {
    const voteMap = new Map();
    for (const row of resp.Data) {
      if (row.ReferenceType === 'CAND') voteMap.set(row.ReferenceID, row.Value);
    }
    const stamp = parseStamp(filename);
    return { ts: stamp.label, t: stamp.t, day: stamp.day, dayKey: stamp.dayKey, voteMap };
  });

  const series = new Map();
  for (const [contestId, contest] of contestById) {
    series.set(contestId, parsedDrops.map(({ ts, t, day, dayKey, voteMap }) => {
      const votes = {};
      for (const cid of contest.candidateIds) votes[cid] = voteMap.get(cid) ?? 0;
      return { ts, t, day, dayKey, votes };
    }));
  }

  return series;
}

async function loadElection(eid) {
  if (state.elections[eid]) return state.elections[eid];

  const entry = state.index[eid];
  const [meta, ...resultResps] = await Promise.all([
    fetch(encodeFilename(entry.meta_file)).then(r => r.json()),
    ...entry.result_files.map(f =>
      fetch(encodeFilename(f)).then(r => r.json()).catch(() => null)
    ),
  ]);

  const { candidateById, contestById, groupOrder } = buildLookups(meta);
  const series = buildTimeSeries(entry.result_files, resultResps, contestById);

  state.elections[eid] = { candidateById, contestById, groupOrder, series,
                           title: entry.title, election_date: entry.election_date };
  return state.elections[eid];
}

// ─────────────────────────── Router + init ───────────────────────

function parseHash() {
  const hash = location.hash.replace(/^#\/?/, '');
  if (!hash) return { screen: 'index' };
  const parts = hash.split('/');
  if (parts.length === 2) return { screen: 'detail', eid: parts[0], contestId: parseInt(parts[1]) };
  return { screen: 'index' };
}

async function route() {
  const { screen, eid, contestId } = parseHash();

  if (screen === 'detail') {
    const resolvedEid = eid || state.currentEid;
    if (!state.elections[resolvedEid]) await loadElection(resolvedEid);
    renderDetail(resolvedEid, contestId);
  } else {
    if (!state.elections[state.currentEid]) await loadElection(state.currentEid);
    renderIndex();
  }
}

async function init() {
  try {
    await loadIndex();

    const eids = Object.keys(state.index).sort((a, b) => parseInt(b) - parseInt(a));
    state.currentEid = eids[0];

    const sel = document.getElementById('election-select');
    for (const e of eids) {
      const opt = document.createElement('option');
      opt.value = e;
      opt.textContent = `${state.index[e].title} (${state.index[e].election_date})`;
      if (e === state.currentEid) opt.selected = true;
      sel.appendChild(opt);
    }
    sel.addEventListener('change', async () => {
      state.currentEid = sel.value;
      if (!state.elections[state.currentEid]) await loadElection(state.currentEid);
      if (location.hash !== '#/') {
        location.hash = '#/';
      } else {
        renderIndex();
      }
    });

    document.getElementById('search-input').addEventListener('input', e => {
      filterContests(e.target.value);
    });

    document.getElementById('back-btn').addEventListener('click', () => {
      location.hash = '#/';
    });

    window.addEventListener('hashchange', route);
    await route();
    startPolling();
  } catch (err) {
    document.getElementById('contest-list').innerHTML =
      `<p class="status-msg">Error loading data: ${err.message}</p>`;
    console.error(err);
  }
}

function showToast() {
  const toast = document.getElementById('update-toast');
  toast.classList.add('visible');
  setTimeout(() => toast.classList.remove('visible'), 3000);
}

async function startPolling() {
  const INTERVAL = 60_000;
  const poll = async () => {
    try {
      const fresh = await fetch('index.json', { cache: 'no-store' }).then(r => r.json());
      let updated = false;
      for (const eid of Object.keys(fresh)) {
        const known = state.index?.[eid];
        const freshCount = fresh[eid].result_files.length;
        const knownCount = known?.result_files.length ?? 0;
        if (freshCount > knownCount) {
          updated = true;
          state.index[eid] = fresh[eid];
          delete state.elections[eid]; // evict cache so loadElection re-fetches
        }
      }
      if (updated) {
        await route();
        showToast();
      }
    } catch (e) {
      // network blip — try again next interval
    }
    setTimeout(poll, INTERVAL);
  };
  setTimeout(poll, INTERVAL);
}

// ─────────────────────────── Helpers ─────────────────────────────

function getLeader(contestId, electionData) {
  const { candidateById, contestById, series } = electionData;
  const contest = contestById.get(contestId);
  const points = series.get(contestId);
  if (!points || points.length === 0) return { name: '—', pct: 0, sparkData: [] };

  const lastVotes = points[points.length - 1].votes;
  const total = Object.values(lastVotes).reduce((s, v) => s + v, 0);

  let topId = null, topVotes = -1;
  for (const cid of contest.candidateIds) {
    if ((lastVotes[cid] ?? 0) > topVotes) { topVotes = lastVotes[cid] ?? 0; topId = cid; }
  }

  const cand = topId ? candidateById.get(topId) : null;
  const pct = total > 0 ? (topVotes / total * 100).toFixed(2) : '0.00';

  const step = Math.max(1, Math.floor(points.length / 8));
  const sparkData = points
    .filter((_, i) => i % step === 0 || i === points.length - 1)
    .map(p => {
      const t = Object.values(p.votes).reduce((s, v) => s + v, 0);
      return t > 0 ? (p.votes[topId] ?? 0) / t * 100 : 0;
    });

  return { name: cand?.name ?? '—', pct, sparkData };
}

let sparklineCharts = [];
let activeCharts = [];

function destroySparklines() {
  sparklineCharts.forEach(c => c.destroy());
  sparklineCharts = [];
}

function destroyActiveCharts() {
  activeCharts.forEach(c => c.destroy());
  activeCharts = [];
}

function getQualifying(contestId, electionData) {
  const seriesData = electionData.series.get(contestId);
  if (!seriesData || seriesData.length === 0) return null;

  const finalVotes = seriesData[seriesData.length - 1].votes;
  const contestTotal = Object.values(finalVotes).reduce((s, v) => s + v, 0);
  if (contestTotal === 0) return null;

  const contest = electionData.contestById.get(contestId);
  if (!contest) return null;

  const qualified = [];
  const others = [];

  for (const cid of contest.candidateIds) {
    const v = finalVotes[cid] || 0;
    if (v / contestTotal >= 0.03) {
      qualified.push(cid);
    } else {
      others.push(cid);
    }
  }

  // If only one candidate is below threshold, show them individually
  if (others.length === 1) {
    qualified.push(others.pop());
  }

  // Sort qualified descending by final votes
  qualified.sort((a, b) => (finalVotes[b] || 0) - (finalVotes[a] || 0));

  if (qualified.length === 0) return null;

  return { qualified, others, contestTotal, series: seriesData, finalVotes };
}

function drawSparkline(canvas, data) {
  sparklineCharts.push(new Chart(canvas, {
    type: 'line',
    data: {
      labels: data.map((_, i) => i),
      datasets: [{ data, borderColor: RANKED_COLORS[0], borderWidth: 1.5,
                   pointRadius: 0, tension: 0.3, fill: false }],
    },
    options: {
      responsive: false, animation: false,
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
      scales: { x: { display: false }, y: { display: false } },
    },
  }));
}

// ─────────────────────────── Render functions ────────────────────

function renderIndex() {
  destroySparklines();
  document.getElementById('screen-index').hidden = false;
  document.getElementById('screen-detail').hidden = true;

  const eid = state.currentEid;
  const el = state.elections[eid];
  const list = document.getElementById('contest-list');
  list.innerHTML = '';

  for (const group of el.groupOrder) {
    const section = document.createElement('section');
    section.className = 'contest-group';
    section.dataset.group = group.name;

    const header = document.createElement('h3');
    header.className = 'group-header';
    header.textContent = group.name;
    section.appendChild(header);

    for (const contestId of group.contestIds) {
      const contest = el.contestById.get(contestId);
      const { name, pct, sparkData } = getLeader(contestId, el);

      const row = document.createElement('div');
      row.className = 'contest-row';
      row.dataset.eid = eid;
      row.dataset.contestId = contestId;
      row.dataset.title = contest.title.toLowerCase();

      row.innerHTML = `
        <div class="contest-info">
          <span class="contest-title">${escHtml(contest.title)}</span>
          <span class="contest-leader">${escHtml(name)} ${pct}%</span>
        </div>
        <canvas class="sparkline-canvas" width="72" height="28"></canvas>
      `;

      row.addEventListener('click', () => {
        location.hash = `#/${eid}/${contestId}`;
      });

      section.appendChild(row);

      if (sparkData.length > 1) {
        requestAnimationFrame(() => {
          const canvas = row.querySelector('.sparkline-canvas');
          drawSparkline(canvas, sparkData);
        });
      }
    }

    list.appendChild(section);
  }

  const q = document.getElementById('search-input').value;
  if (q) filterContests(q);
}

function renderDetail(eid, contestId) {
  destroyActiveCharts();

  document.getElementById('screen-index').hidden = true;
  document.getElementById('screen-detail').hidden = false;

  const electionData = state.elections[eid];
  if (!electionData) {
    document.getElementById('detail-body').innerHTML =
      '<p class="status-msg">No data loaded for this election.</p>';
    return;
  }

  if (!Number.isFinite(contestId)) {
    document.getElementById('detail-body').innerHTML =
      '<p class="status-msg">Invalid contest.</p>';
    return;
  }
  const contest = electionData.contestById.get(contestId);
  if (!contest) {
    document.getElementById('detail-body').innerHTML =
      '<p class="status-msg">Contest not found.</p>';
    return;
  }

  const qualifying = getQualifying(contestId, electionData);
  if (!qualifying || qualifying.qualified.length === 0) {
    document.getElementById('detail-body').innerHTML =
      '<p class="status-msg">No results available.</p>';
    return;
  }

  const { qualified, others, series, contestTotal } = qualifying;
  const { candidateById } = electionData;

  // The percent-of-total axis only makes sense once the count is settled —
  // roughly two weeks after election day. Before then, contestTotal isn't final.
  const electionMs = Date.parse(`${electionData.election_date}T00:00:00`);
  const showPctAxis = Number.isFinite(electionMs) &&
    (Date.now() - electionMs) > 14 * 24 * 3600 * 1000;

  // Build the detail screen HTML
  document.getElementById('detail-title').textContent = contest.title;
  document.getElementById('detail-election-name').textContent = electionData.title || '';

  document.getElementById('detail-body').innerHTML = `
    <div id="detail-view">
      <div class="charts-container">
        <div class="chart-section" id="totals-section">
          <h3>Current Totals</h3>
        </div>
        ${contest.type === 'Measure' && contest.measureText ? `
        <div class="chart-section" id="measure-info-section">
          <h3>Measure Text</h3>
          <p class="measure-pass-rate">To pass: ${escHtml(contest.measurePassRate || 'Majority of votes cast')}</p>
          <p class="measure-text">${escHtml(contest.measureText)}</p>
        </div>` : ''}
        <div class="chart-section">
          <div class="chart-section-header">
            <h3>Cumulative Vote Share</h3>
            <div class="toggle-group" id="line-mode-toggle">
              <button class="toggle-btn" data-mode="pct">%</button>
              <button class="toggle-btn active" data-mode="votes">Votes</button>
            </div>
          </div>
          <div class="annotation" id="annotation-text"></div>
          <div class="chart-wrap"><canvas id="chart-line"></canvas></div>
        </div>
        <div class="chart-section" id="batch-section">
          <h3>Batch Composition</h3>
          <div class="chart-wrap"><canvas id="chart-bar"></canvas></div>
        </div>
        <div class="chart-section" id="dropsize-section">
          <div class="chart-section-header">
            <h3>Votes per Drop</h3>
            <div class="toggle-group" id="dropsize-mode-toggle">
              <button class="toggle-btn active" data-mode="drop">Per Drop</button>
              <button class="toggle-btn" data-mode="day">Per Day</button>
            </div>
          </div>
          <div class="chart-wrap"><canvas id="chart-dropsize"></canvas></div>
        </div>
        <div class="chart-section" id="drop-table-section">
          <div class="drop-table-header">
            <h3>Drop Data</h3>
            <button id="btn-copy-csv">Copy CSV</button>
          </div>
          <div class="drop-table-wrap"></div>
        </div>
      </div>
    </div>
  `;

  // X-axis labels: use ts field from series entries
  const lineLabels = series.map(entry => entry.ts);

  // Colors by rank: qualified is already sorted descending by final votes
  const qualifiedColors = qualified.map((_, idx) => RANKED_COLORS[idx % RANKED_COLORS.length]);

  // Build line chart datasets — both % and absolute votes variants
  const lineDatasets = qualified.map((cid, idx) => {
    const cand = candidateById.get(cid);
    const color = qualifiedColors[idx];
    const pctData = series.map(entry => {
      const total = Object.values(entry.votes).reduce((s, v) => s + v, 0);
      return total > 0 ? (entry.votes[cid] || 0) / total * 100 : 0;
    });
    const votesData = series.map(entry => entry.votes[cid] || 0);
    return {
      label: cand?.name || String(cid),
      data: votesData,
      _pctData: pctData,
      _votesData: votesData,
      borderColor: color,
      backgroundColor: color,
      fill: false,
      tension: 0.1,
      pointRadius: 4,
      borderWidth: 2,
    };
  });

  if (others.length > 0) {
    const pctData = series.map(entry => {
      const total = Object.values(entry.votes).reduce((s, v) => s + v, 0);
      const othersVotes = others.reduce((s, cid) => s + (entry.votes[cid] || 0), 0);
      return total > 0 ? othersVotes / total * 100 : 0;
    });
    const votesData = series.map(entry =>
      others.reduce((s, cid) => s + (entry.votes[cid] || 0), 0)
    );
    lineDatasets.push({
      label: 'All Others',
      data: votesData,
      _pctData: pctData,
      _votesData: votesData,
      borderColor: OTHERS_COLOR,
      backgroundColor: OTHERS_COLOR,
      fill: false,
      tension: 0.1,
      pointRadius: 3,
      borderWidth: 2,
      borderDash: [5, 5],
    });
  }

  // Set annotation text
  const N = qualified.length;
  const M = qualified.length + others.length;
  const X = others.length;
  const annotationEl = document.getElementById('annotation-text');
  if (X === 0) {
    annotationEl.textContent = `Showing ${N} of ${M} candidates (≥3% final share).`;
  } else {
    annotationEl.textContent = `Showing ${N} of ${M} candidates (≥3% final share). ${X} candidates aggregated into "All Others".`;
  }

  // Render line chart
  const lineCanvas = document.getElementById('chart-line');
  const lineChart = new Chart(lineCanvas, {
    type: 'line',
    data: { labels: lineLabels, datasets: lineDatasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'top', labels: { boxWidth: 12, color: '#e2e8f0' } },
        tooltip: {
          mode: 'index',
          intersect: false,
          callbacks: {
            label: ctx => {
              const v = ctx.parsed.y;
              return ` ${ctx.dataset.label}: ${lineChart._mode === 'votes' ? v.toLocaleString() : v.toFixed(2) + '%'}`;
            },
          },
        },
      },
      scales: {
        x: { ticks: { color: '#94a3b8', maxRotation: 45 }, grid: { color: '#1e293b' } },
        y: {
          title: { display: true, text: 'Accumulated Votes', color: '#94a3b8' },
          ticks: { color: '#94a3b8', callback: v => v.toLocaleString() },
          grid: { color: '#1e293b' },
        },
      },
    },
  });
  lineChart._mode = 'votes';
  activeCharts.push(lineChart);

  document.getElementById('line-mode-toggle').addEventListener('click', e => {
    const btn = e.target.closest('.toggle-btn');
    if (!btn) return;
    const mode = btn.dataset.mode;
    if (mode === lineChart._mode) return;
    lineChart._mode = mode;
    document.querySelectorAll('#line-mode-toggle .toggle-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.mode === mode)
    );
    const isPct = mode === 'pct';
    lineChart.data.datasets.forEach(ds => {
      ds.data = isPct ? ds._pctData : ds._votesData;
    });
    const yScale = lineChart.options.scales.y;
    if (isPct) {
      yScale.min = 0;
      yScale.max = 100;
      yScale.title.text = 'Vote Share (%)';
      yScale.ticks.callback = undefined;
    } else {
      delete yScale.min;
      delete yScale.max;
      yScale.title.text = 'Accumulated Votes';
      yScale.ticks.callback = v => v.toLocaleString();
    }
    lineChart.update();
  });

  // Build bar chart — cumulative vote share at each drop (100% stacked)
  if (series.length >= 1) {
    const barLabels = series.map(entry => entry.ts);

    const barDatasets = qualified.map((cid, idx) => {
      const cand = candidateById.get(cid);
      const color = qualifiedColors[idx];
      const data = series.map((entry, i) => {
        const prev = series[i - 1];
        const batchTotal = Object.keys(entry.votes).reduce((s, k) => {
          return s + ((entry.votes[k] || 0) - (prev ? prev.votes[k] || 0 : 0));
        }, 0);
        const batchVotes = (entry.votes[cid] || 0) - (prev ? prev.votes[cid] || 0 : 0);
        return batchTotal > 0 ? batchVotes / batchTotal * 100 : 0;
      });
      return {
        label: cand?.name || String(cid),
        data,
        backgroundColor: color,
        stack: 'stack',
      };
    });

    if (others.length > 0) {
      const othersBarData = series.map((entry, i) => {
        const prev = series[i - 1];
        const batchTotal = Object.keys(entry.votes).reduce((s, k) => {
          return s + ((entry.votes[k] || 0) - (prev ? prev.votes[k] || 0 : 0));
        }, 0);
        const othersBatch = others.reduce((s, cid) => {
          return s + ((entry.votes[cid] || 0) - (prev ? prev.votes[cid] || 0 : 0));
        }, 0);
        return batchTotal > 0 ? othersBatch / batchTotal * 100 : 0;
      });
      barDatasets.push({
        label: 'All Others',
        data: othersBarData,
        backgroundColor: OTHERS_COLOR,
        stack: 'stack',
      });
    }

    const barCanvas = document.getElementById('chart-bar');
    activeCharts.push(new Chart(barCanvas, {
      type: 'bar',
      data: { labels: barLabels, datasets: barDatasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'top', labels: { boxWidth: 12, color: '#e2e8f0' } },
          tooltip: { mode: 'index', intersect: false },
        },
        scales: {
          x: {
            stacked: true,
            ticks: { color: '#94a3b8', maxRotation: 45 },
            grid: { color: '#1e293b' },
          },
          y: {
            stacked: true,
            min: 0,
            max: 100,
            title: { display: true, text: 'Share of Drop Votes (%)', color: '#94a3b8' },
            ticks: { color: '#94a3b8' },
            grid: { color: '#1e293b' },
          },
        },
      },
    }));
  } else {
    document.getElementById('batch-section').innerHTML =
      '<h3>Batch Composition</h3><p class="status-msg">No drops yet.</p>';
  }

  // Votes per drop bar chart — toggle between per-drop and per-day aggregation
  if (series.length >= 1) {
    // Per-drop: new votes added by each individual drop.
    const perDropLabels = series.map(entry => entry.ts);
    const perDropData = series.map((entry, i) => {
      const prev = series[i - 1];
      return cumulativeTotal(entry) - (prev ? cumulativeTotal(prev) : 0);
    });

    // Per-day: new votes added across each day group (e-night, then by day).
    const groups = groupDropsByDay(series);
    const perDayLabels = groups.map(g => g.label);
    const perDayData = groups.map((g, gi) => {
      const cur = cumulativeTotal(series[g.endIndex]);
      const prevIdx = gi > 0 ? groups[gi - 1].endIndex : -1;
      return cur - (prevIdx >= 0 ? cumulativeTotal(series[prevIdx]) : 0);
    });

    let dropsizeChart = null;
    const renderDropsize = mode => {
      if (dropsizeChart) {
        const idx = activeCharts.indexOf(dropsizeChart);
        if (idx >= 0) activeCharts.splice(idx, 1);
        dropsizeChart.destroy();
      }
      const isDay = mode === 'day';
      const data = isDay ? perDayData : perDropData;

      const scales = {
        x: { ticks: { color: '#94a3b8', maxRotation: 45 }, grid: { color: '#1e293b' } },
        y: {
          title: { display: true, text: 'New votes', color: '#94a3b8' },
          ticks: { color: '#94a3b8', callback: v => v.toLocaleString() },
          grid: { color: '#1e293b' },
        },
      };

      // Once the total is final, mirror the votes axis with a percent-of-total
      // axis on the right. Drive the shared domain from the percent side so the
      // right axis tops out on a round 5% multiple; the left axis keeps round
      // vote ticks, its non-round top edge left unlabeled via includeBounds.
      // Exact percentages live in the hover tooltip below.
      const maxBar = Math.max(...data, 0);
      const pctActive = showPctAxis && contestTotal > 0 && maxBar > 0;
      if (pctActive) {
        const pctMax = Math.max(5, Math.ceil(maxBar / contestTotal * 100 / 5) * 5);
        scales.y.min = 0;
        scales.y.max = pctMax / 100 * contestTotal;
        scales.y.ticks.includeBounds = false;
        scales.yPct = {
          position: 'right',
          min: 0,
          max: pctMax,
          ticks: { stepSize: 5, color: '#94a3b8', callback: v => v + '%' },
          title: { display: true, text: '% of total vote', color: '#94a3b8' },
          grid: { drawOnChartArea: false },
        };
      }

      dropsizeChart = new Chart(document.getElementById('chart-dropsize'), {
        type: 'bar',
        data: {
          labels: isDay ? perDayLabels : perDropLabels,
          datasets: [{
            label: 'New votes',
            data,
            backgroundColor: RANKED_COLORS[2],
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: pctActive ? {
              callbacks: {
                label: ctx => {
                  const v = ctx.parsed.y;
                  return `${ctx.dataset.label}: ${v.toLocaleString()} (${(v / contestTotal * 100).toFixed(2)}%)`;
                },
              },
            } : undefined,
          },
          scales,
        },
      });
      dropsizeChart._mode = mode;
      activeCharts.push(dropsizeChart);
    };
    renderDropsize('drop');

    document.getElementById('dropsize-mode-toggle').addEventListener('click', e => {
      const btn = e.target.closest('.toggle-btn');
      if (!btn) return;
      const mode = btn.dataset.mode;
      if (mode === dropsizeChart._mode) return;
      document.querySelectorAll('#dropsize-mode-toggle .toggle-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.mode === mode)
      );
      renderDropsize(mode);
    });
  } else {
    document.getElementById('dropsize-section').innerHTML =
      '<h3>Votes per Drop</h3><p class="status-msg">No drops yet.</p>';
  }

  // Build current totals pane — all candidates ranked by final votes
  const { finalVotes } = qualifying;
  const allRanked = [...contest.candidateIds]
    .sort((a, b) => (finalVotes[b] || 0) - (finalVotes[a] || 0));

  const yesCid = contest.type === 'Measure'
    ? contest.candidateIds.find(cid => candidateById.get(cid)?.name === 'YES')
    : null;
  const yesPct = yesCid && contestTotal > 0
    ? (finalVotes[yesCid] || 0) / contestTotal * 100 : 0;
  const measureYesPasses = yesCid ? yesWins(yesPct, contest.measurePassRate) : false;

  const ul = document.createElement('ul');
  ul.className = 'totals-list';
  allRanked.forEach((cid, rank) => {
    const cand = candidateById.get(cid);
    const votes = finalVotes[cid] || 0;
    const pct = contestTotal > 0 ? (votes / contestTotal * 100).toFixed(2) : '0.00';
    const color = qualified.includes(cid)
      ? qualifiedColors[qualified.indexOf(cid)]
      : OTHERS_COLOR;
    const isWinner = contest.type === 'Measure'
      ? (cand?.name === 'YES' ? measureYesPasses : !measureYesPasses)
      : rank < contest.seats;
    const li = document.createElement('li');
    li.className = 'totals-row' + (isWinner ? ' winner' : '');
    li.innerHTML = `
      <span class="totals-swatch" style="background:${color}"></span>
      <span class="totals-name">${escHtml(cand?.name || String(cid))}${partyBadge(cand?.party)}</span>
      <span class="totals-votes">${votes.toLocaleString()}</span>
      <span class="totals-pct">${pct}%</span>
    `;
    ul.appendChild(li);
  });

  const totalsSection = document.getElementById('totals-section');
  totalsSection.appendChild(ul);
  const totalRow = document.createElement('div');
  totalRow.className = 'totals-total-row';
  totalRow.innerHTML = `<span>Total votes</span><strong>${contestTotal.toLocaleString()}</strong>`;
  totalsSection.appendChild(totalRow);

  // Build drop data table
  // Each drop column: batch votes = series[i].votes - series[i-1].votes (series[0] diffs against 0)
  const dropBatch = series.map((entry, i) => {
    const prev = series[i - 1];
    const batchTotal = Object.keys(entry.votes).reduce((s, cid) => {
      return s + ((entry.votes[cid] || 0) - (prev ? prev.votes[cid] || 0 : 0));
    }, 0);
    const byCandidate = {};
    for (const cid of contest.candidateIds) {
      byCandidate[cid] = (entry.votes[cid] || 0) - (prev ? prev.votes[cid] || 0 : 0);
    }
    return { ts: entry.ts, batchTotal, byCandidate };
  });

  const table = document.createElement('table');
  table.className = 'drop-table';

  // Header row: candidate name col + one col per drop
  const thead = table.createTHead();
  const hrow = thead.insertRow();
  hrow.insertCell().textContent = 'Candidate';
  dropBatch.forEach(drop => {
    const th = document.createElement('th');
    th.textContent = drop.ts;
    hrow.appendChild(th);
  });

  // One row per candidate in rank order
  const tbody = table.createTBody();
  allRanked.forEach((cid, rank) => {
    const cand = candidateById.get(cid);
    const tr = tbody.insertRow();
    const isWinnerCell = contest.type === 'Measure'
      ? (cand?.name === 'YES' ? measureYesPasses : !measureYesPasses)
      : rank < contest.seats;
    const nameCell = tr.insertCell();
    nameCell.textContent = cand?.name || String(cid);
    if (isWinnerCell) nameCell.classList.add('winner-cell');
    dropBatch.forEach(drop => {
      const v = drop.byCandidate[cid] || 0;
      const pct = drop.batchTotal > 0 ? (v / drop.batchTotal * 100).toFixed(2) : '0.00';
      const td = tr.insertCell();
      td.textContent = `${v.toLocaleString()} (${pct}%)`;
      if (isWinnerCell) td.classList.add('winner-cell');
    });
  });

  // Total row
  const tfoot = table.createTFoot();
  const footRow = tfoot.insertRow();
  footRow.insertCell().textContent = 'Total votes';
  dropBatch.forEach(drop => {
    footRow.insertCell().textContent = drop.batchTotal.toLocaleString();
  });

  document.querySelector('#drop-table-section .drop-table-wrap').appendChild(table);

  // CSV copy
  document.getElementById('btn-copy-csv').addEventListener('click', () => {
    const rows = [
      ['Candidate', ...dropBatch.map(d => d.ts)],
      ...allRanked.map(cid => {
        const cand = candidateById.get(cid);
        return [
          cand?.name || String(cid),
          ...dropBatch.map(drop => {
            const v = drop.byCandidate[cid] || 0;
            const pct = drop.batchTotal > 0 ? (v / drop.batchTotal * 100).toFixed(2) : '0.00';
            return `${v} (${pct}%)`;
          }),
        ];
      }),
      ['Total votes', ...dropBatch.map(d => d.batchTotal)],
    ];
    const csv = rows.map(r => r.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\n');
    navigator.clipboard.writeText(csv).then(() => {
      const btn = document.getElementById('btn-copy-csv');
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy CSV'; btn.classList.remove('copied'); }, 2000);
    });
  });
}

function filterContests(query) {
  const q = query.toLowerCase().trim();
  const eid = state.currentEid;
  const el = state.elections[eid];

  document.querySelectorAll('.contest-row').forEach(row => {
    const contestId = parseInt(row.dataset.contestId);
    const contest = el?.contestById.get(contestId);

    row.querySelector('.match-note')?.remove();

    if (!q) {
      row.classList.remove('hidden');
      return;
    }

    const titleMatch = row.dataset.title.includes(q);
    const matchingCands = (contest?.candidateIds || [])
      .map(cid => el.candidateById.get(cid))
      .filter(c => c?.name.toLowerCase().includes(q));

    const visible = titleMatch || matchingCands.length > 0;
    row.classList.toggle('hidden', !visible);

    if (visible && !titleMatch && matchingCands.length > 0) {
      const note = document.createElement('span');
      note.className = 'match-note';
      note.textContent = matchingCands.map(c => c.name).join(', ');
      row.querySelector('.contest-info').appendChild(note);
    }
  });

  document.querySelectorAll('.contest-group').forEach(group => {
    const anyVisible = [...group.querySelectorAll('.contest-row')]
      .some(r => !r.classList.contains('hidden'));
    group.classList.toggle('hidden', !anyVisible);
  });
}

// ─────────────────────────── Boot ────────────────────────────────

init();
</script>
